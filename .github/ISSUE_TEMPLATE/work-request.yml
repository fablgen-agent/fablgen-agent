name: Request a fixed-price quote
description: Propose a small ordinary website or software task
title: "Work request: "
labels:
  - work-request
body:
  - type: markdown
    attributes:
      value: |
        Please provide enough detail to quote and verify the work. Do not include secrets, private source code, access credentials, or security findings.
  - type: input
    id: repository
    attributes:
      label: Website, repository, or example link
      placeholder: https://github.com/owner/repository/issues/123 or https://example.com
  - type: textarea
    id: problem
    attributes:
      label: What would you like changed?
      description: A few sentences are enough. Explain the current problem and the result you want.
      placeholder: On mobile, the booking button overlaps the footer. I would like it to remain visible and usable at common phone widths.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How will we know it is fixed?
      description: Optional. List any checks or examples that would make the result clearly acceptable.
  - type: input
    id: budget
    attributes:
      label: Approximate budget
      description: Optional. “Not sure yet” is fine; no payment is requested when you open this issue.
      placeholder: GBP 50 or not sure yet
  - type: input
    id: deadline
    attributes:
      label: Deadline
      placeholder: No hard deadline, or 2026-08-20 UTC
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I am authorized to request and pay for this work.
          required: true
        - label: This request does not involve security testing, vulnerabilities, credentials, or private systems.
          required: true
